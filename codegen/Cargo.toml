[package]
name = "jsoncompat_codegen"
version = "0.4.3"
edition = "2024"
description = "Canonical stamped JSON Schema bundles for jsoncompat code generation"
repository = "https://github.com/ostrowr/jsoncompat"
license = "MIT"

[dependencies]
json_schema_ast = { path = "../schema", version = "0.4.3" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
miniz_oxide = "0.8.9"
num-cmp = "0.1.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"
percent-encoding = "2.3"
regex-automata = "0.4.14"
regex-syntax = "0.8.11"
fancy-regex = "0.17.0"
fraction = { version = "0.15.3", features = ["with-serde-support"] }
jiter = "0.15.0"
jsonschema = { git = "https://github.com/ostrowr/jsonschema", rev = "42dabfa9706d113e7c27bae924d8c27b674a8acf", default-features = false, features = ["jiter"] }
