[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name    = "jsoncompat"        # wheel / PyPI name
dynamic = ["version"]         # "version" pulled from Cargo.toml
description = "JSON Schema compatibility checker for evolving schemas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typing-extensions>=4.13"]

[project.optional-dependencies]
msgpack = ["msgpack>=1.1.1"]
yaml = ["PyYAML>=6.0.2"]

[dependency-groups]
http-examples = [
    "aiohttp>=3.11,<4",
    "httpx>=0.28,<1",
    "requests>=2.32,<3",
    "types-requests>=2.32",
]
benchmark = [
    "datamodel-code-generator==0.64.0",
    "pydantic[email]==2.13.4",
]

[tool.maturin]
module-name = "jsoncompat._native"
python-source = "."
