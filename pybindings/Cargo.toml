[package]
name = "jsoncompat_py"
version = "0.5.0"
readme = "README.md"
edition = "2024"
publish = false # This crate is not published to crates.io; only PyPI.

[lib]
name = "jsoncompat"
crate-type = ["cdylib"]
doc = false

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "generate-import-lib"] }
serde_json = "1.0.149"
jiter = { version = "0.15.0", features = ["python"] }
num-bigint = "0.4"
num-traits = "0.2"
anyhow = "1.0.102"
rand = "0.10.0"

# Internal crates
jsoncompat_codegen = { path = "../codegen" }
jsoncompat = { path = ".." }
json_schema_ast = { path = "../schema" }
json_schema_fuzz = { path = "../fuzz" }
jsonschema = { version = "0.45", default-features = false }

[build-dependencies]
pyo3-build-config = "0.28.3"

[features]
default = []
arbitrary-precision = [
    "jsonschema/arbitrary-precision",
    "jsoncompat/arbitrary-precision",
    "jsoncompat_codegen/arbitrary-precision",
    "json_schema_ast/arbitrary-precision",
    "json_schema_fuzz/arbitrary-precision",
]

[package.metadata.maturin]
# Include PEP 561 style typing information (py.typed + .pyi stubs) in the wheel.
include-type-hints = true
